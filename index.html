<!DOCTYPE html>
<html lang="nl">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5LCSBW7WSV"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-5LCSBW7WSV');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <title>AutiWiki</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f9f9f9;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 1.8em;
    }

    .language-buttons button {
      padding: 6px 12px;
      font-size: 1em;
      cursor: pointer;
    }

    .pdf-container {
      width: 100%;
      height: calc(100vh - 170px); /* Berekende hoogte om footer omhoog te halen */
      border: 1px solid #ccc;
      background: white;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding: 10px 0;
      border-top: 1px solid #ddd;
    }

    .copyright {
      font-size: 0.9em;
      color: #666;
      margin: 0;
    }

    .cta-container {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e67e22; /* Opvallende kleur voor de CTA */
      font-weight: bold;
      margin-right: 80px; /* Ruimte maken voor de chatbot icoon */
    }

    .arrow {
      font-size: 1.5em;
      display: inline-block;
      animation: bounceRight 1s infinite alternate ease-in-out;
    }

    @keyframes bounceRight {
      from { transform: translateX(0); }
      to { transform: translateX(10px); }
    }

    /* Mobiele weergave: stapel de elementen */
    @media (max-width: 768px) {
      .footer {
        flex-direction: column;
        gap: 15px;
        text-align: center;
      }
      .cta-container {
        margin-right: 0;
        margin-bottom: 60px; /* Ruimte boven de zwevende chatbot icoon op mobiel */
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>AutiWiki</h1>
    <div class="language-buttons">
      <button onclick="loadPdf('autiwiki-nl.pdf')">NL</button>
      <button onclick="loadPdf('autiwiki-en.pdf')">EN</button>
      <button onclick="loadPdf('autiwiki-fr.pdf')">FR</button>
    </div>
  </div>

  <embed id="pdfViewer" src="autiwiki-nl.pdf" type="application/pdf" class="pdf-container" />

  <footer class="footer">
    <p class="copyright">Copyright © Sterkmakers in autisme , Peter Vermeulen , Karel Decherf</p>
    <div class="cta-container">
      Vraag het aan onze AI-expert! <span class="arrow">➔</span>
    </div>
  </footer>

  <!-- BotPress Chatbot -->
    <script src="https://cdn.botpress.cloud/webchat/v3.6/inject.js"></script>
<script src="https://files.bpcontent.cloud/2025/08/13/16/20250813160706-I4RPYOII.js" defer></script>
    

  <!-- PDF wissel-functie -->
  <script>
    function loadPdf(filename) {
      const viewer = document.getElementById('pdfViewer');
      if (viewer) viewer.src = filename;
    }
  </script>
</body>
</html>
